services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo}
      POSTGRES_DB: ${POSTGRES_DB:-seo_link_building}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://seo:seo@db:5432/seo_link_building}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps/api:/app

  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://seo:seo@db:5432/seo_link_building}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    # Same image as `api`, different entrypoint — see app/jobs/worker.py.
    # Exits immediately if neither OPENAI_API_KEY nor ANTHROPIC_API_KEY is
    # set in .env; `restart: unless-stopped` will just keep retrying it,
    # which is fine (a compose-native way to signal "not configured yet")
    # but worth knowing before you go looking for why jobs never run.
    command: python -m app.jobs.worker
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api
    # Overrides the image's built (production) CMD with the dev server +
    # a source bind-mount, matching `api`'s --reload above. For an actual
    # production deploy, drop this `command`/`volumes` pair and the image
    # built by apps/web/Dockerfile runs `next start` as-is.
    command: npm run dev
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  db_data:
